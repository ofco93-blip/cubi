name: Firmas

# ENSAYO: imprime las firmas exactas del kit de navegación de Google, para escribir el código sin adivinar. No publica nada.
on:
  push:
    branches: [prueba-google]

jobs:
  firmas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          curl -sSfLO https://dl.google.com/android/maven2/com/google/android/libraries/navigation/navigation/7.9.0/navigation-7.9.0.aar
          unzip -q -o navigation-7.9.0.aar classes.jar && ls -l navigation-7.9.0.aar
          P=com.google.android.libraries.navigation
          javap -cp classes.jar $P.NavigationApi "$P.NavigationApi\$NavigatorListener" "$P.NavigationApi\$OnTermsResponseListener" "$P.NavigationApi\$ErrorCode" $P.Waypoint "$P.Waypoint\$Builder" $P.Navigator "$P.Navigator\$RouteStatus" $P.NavigationViewForAuto $P.ListenableResultFuture "$P.ListenableResultFuture\$OnResultListener" $P.TermsAndConditionsCheckOption $P.TermsAndConditionsUIParams 2>&1 | grep -v "^  private\|^  static {}" | cut -c1-260
