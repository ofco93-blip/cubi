name: Ver caras

# Dibuja las caras en el PC (mismo código del firmware) y deja la hoja y los GIFs en la versión "vista".
on:
  push:
    branches: [main, "prueba-*"]
    paths: ["firmware/cubi/caras.*", "firmware/cubi/tempo.h", "firmware/cubi/dibujo.*", "herramientas/vista/**", ".github/workflows/vista.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dibujar
        run: |
          # si algo falla, las últimas líneas salen como anotaciones (se ven sin entrar al registro)
          ( set -ex
            python3 -m pip install -q --break-system-packages pillow
            g++ -std=c++17 herramientas/vista/tempo_prueba.cpp -o tempo_prueba && ./tempo_prueba
            g++ -O2 -std=c++17 -I herramientas/vista herramientas/vista/vista.cpp firmware/cubi/caras.cpp firmware/cubi/dibujo.cpp -o vista_pc
            python3 herramientas/vista/hoja.py ./vista_pc salida canta_jazz baila_jazz canta_pop baila_pop canta_urbano baila_urbano canta_dj canta_piano canta_barras canta_tropical canta_electro reposo escucha habla frenazo bache sol lluvia mini_reposo mini_habla mini_escucha mini_risa mini_amor mini_frenazo mini_izq mini_sorpresa mini_caricia mini_whatsapp mini_bateria mini_duerme mini_maps_izq mini_llamada mini_lluvia mini_sol kamehameha mini_kamehameha confeti mini_confeti clima mini_clima mini_canta_pop mini_canta_urbano mini_canta_electro mini_canta_tropical mini_canta_kpop mini_canta_corazon mini_canta_groove mini_canta_guitarra mini_canta_disfruta mini_canta_rock mini_canta_jazz mini_canta_dj mini_canta_piano mini_canta_barras mini_baila_pop novas_reposo novas_risa novas_frenazo kiras_reposo kiras_amor kiras_risa colores_reposo colores_canta_pop colores_sorpresa altura mini_altura ovalo_reposo ovalo_risa ovalo_frenazo ovalo_canta_pop ovalo_canta_guitarra novas_canta_rock kiras_canta_jazz neon_reposo neon_amor neon_risa simple_reposo simple_risa simple_frenazo simple_duerme
            ./vista_pc medir > medir.txt
            REDONDA=1 ./vista_pc medir > medir_redonda.txt; cp medir.txt medir_redonda.txt redonda/
            REDONDA=1 python3 herramientas/vista/hoja.py ./vista_pc redonda mini_reposo mini_escucha mini_habla mini_piensa mini_duerme mini_telefono mini_saludo mini_bache mini_frenazo mini_aceleron mini_arranque mini_izq mini_der mini_caricia mini_whatsapp mini_llamada mini_calor mini_risa mini_sorpresa mini_amor mini_mareo mini_llegamos mini_sol mini_lluvia mini_frio mini_bateria mini_guino mini_curiosa mini_kamehameha mini_confeti mini_cinturon mini_sonrojo mini_enojo mini_papas mini_bebida mini_consola mini_cono mini_crispetas mini_feliz mini_triste mini_sueno mini_ppt_piedra mini_ppt_papel mini_ppt_tijera mini_canta_pop mini_canta_urbano mini_canta_electro mini_canta_tropical mini_canta_kpop mini_canta_corazon mini_canta_groove mini_canta_guitarra mini_canta_disfruta mini_canta_rock mini_canta_jazz mini_canta_dj mini_canta_piano mini_canta_barras mini_canta_manos mini_canta_acordeon mini_canta_vela lino_reposo lino_risa lino_amor mochi_reposo mochi_risa mochi_sonrojo gato_reposo gato_canta_pop clima altura
          ) > log.txt 2>&1 || { grep -v "^+" log.txt | grep -m 12 . | tail -12 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Tiempos por baile
        run: echo "::notice::$(sort -t' ' -k3 -n -r medir.txt | tr '\n' ';')"
      - uses: actions/upload-artifact@v4
        with:
          name: redonda
          path: redonda/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vista
          name: Caras (vista previa)
          prerelease: true
          files: salida/*
