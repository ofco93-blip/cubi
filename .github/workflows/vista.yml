name: Ver caras

# Dibuja las caras en el PC (mismo código del firmware) y deja la hoja y los GIFs en la versión "vista".
on:
  push:
    branches: [main]
    paths: ["firmware/cubi/caras.*", "firmware/cubi/dibujo.*", "herramientas/vista/**", ".github/workflows/vista.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dibujar
        run: |
          # si algo falla, las últimas líneas salen como anotaciones (se ven sin entrar al registro)
          ( set -ex
            python3 -m pip install -q --break-system-packages pillow
            g++ -O2 -std=c++17 -I herramientas/vista herramientas/vista/vista.cpp firmware/cubi/caras.cpp firmware/cubi/dibujo.cpp -o vista_pc
            python3 herramientas/vista/hoja.py ./vista_pc salida canta_jazz canta_dj canta_piano canta_barras canta_pop canta_tropical canta_urbano canta_electro reposo escucha habla frenazo bache
          ) > log.txt 2>&1 || { grep -v "^+" log.txt | grep -m 12 . | tail -12 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vista
          name: Caras (vista previa)
          prerelease: true
          files: salida/*
