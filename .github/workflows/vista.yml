name: Ver caras

# Dibuja las caras en el PC (mismo código del firmware) y deja la hoja y los GIFs en la versión "vista".
on:
  push:
    branches: [main, "prueba-*"]
    paths: ["firmware/cubi/caras.*", "firmware/cubi/tempo.h", "firmware/cubi/dibujo.*", "herramientas/vista/**", ".github/workflows/vista.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dibujar
        run: |
          # si algo falla, las últimas líneas salen como anotaciones (se ven sin entrar al registro)
          ( set -ex
            python3 -m pip install -q --break-system-packages pillow
            g++ -std=c++17 herramientas/vista/tempo_prueba.cpp -o tempo_prueba && ./tempo_prueba
            g++ -O2 -std=c++17 -I herramientas/vista herramientas/vista/vista.cpp firmware/cubi/caras.cpp firmware/cubi/dibujo.cpp -o vista_pc
            python3 herramientas/vista/hoja.py ./vista_pc salida canta_jazz baila_jazz canta_pop baila_pop canta_urbano baila_urbano canta_dj canta_piano canta_barras canta_tropical canta_electro reposo escucha habla frenazo bache mini_reposo mini_habla mini_escucha mini_risa mini_amor mini_frenazo mini_izq mini_sorpresa mini_caricia mini_whatsapp mini_bateria mini_duerme mini_canta_pop mini_canta_urbano mini_canta_electro mini_canta_tropical mini_canta_kpop mini_canta_corazon mini_canta_groove mini_canta_guitarra mini_canta_disfruta mini_canta_rock mini_canta_jazz mini_canta_dj mini_canta_piano mini_canta_barras mini_baila_pop
            ./vista_pc medir > medir.txt
          ) > log.txt 2>&1 || { grep -v "^+" log.txt | grep -m 12 . | tail -12 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Tiempos por baile
        run: echo "::notice::$(sort -t' ' -k3 -n -r medir.txt | tr '\n' ';')"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vista
          name: Caras (vista previa)
          prerelease: true
          files: salida/*
