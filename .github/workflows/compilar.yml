name: Compilar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un solo trabajo que publica directo en la versión: no usa el almacenamiento de artefactos de Actions.
jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      URL_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: App Android
        env:
          CUBI_LLAVE: ${{ secrets.CUBI_LLAVE }}
          CUBI_CLAVE: ${{ secrets.CUBI_CLAVE }}
        run: |
          echo "$CUBI_LLAVE" | base64 -d > android/app/cubi.p12
          gradle -p android assembleRelease --no-daemon
          rm android/app/cubi.p12
          cp android/app/build/outputs/apk/release/app-release.apk Cubi.apk

      - uses: arduino/setup-arduino-cli@v2
      - name: Firmware
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP32"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL_ESP32"
          # el firmware sabe su número de versión (la app lo muestra)
          N=${{ github.run_number }}
          { echo '#pragma once'; echo "#define VERSION_FW $N"; echo "#define VERSION_FW_TXT \"$N\""; } > firmware/cubi/version.h
          arduino-cli lib install "GFX Library for Arduino@1.6.9" "arduinoFFT@2.0.4" "XPowersLib@0.3.3"
          arduino-cli compile --fqbn "esp32:esp32:waveshare_esp32_s3_touch_amoled_18:PSRAM=enabled,CDCOnBoot=cdc" --output-dir out firmware/cubi
          cp out/cubi.ino.bin cubi.ino.bin

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Cubi v2.0.${{ github.run_number }}
          body: |
            - **Cubi.apk**: ábrelo desde el celular para instalar o actualizar la app.
            - **cubi.ino.bin**: en la app, Ajustes › Actualizar el robot.
          files: |
            Cubi.apk
            cubi.ino.bin
