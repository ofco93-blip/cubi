name: Compilar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Cubi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: Cubi.apk

  firmware:
    runs-on: ubuntu-latest
    env:
      URL_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls "$URL_ESP32"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL_ESP32"
          arduino-cli lib install "GFX Library for Arduino@1.6.9" "arduinoFFT@2.0.4" "XPowersLib@0.3.3"
          arduino-cli compile --fqbn "esp32:esp32:waveshare_esp32_s3_touch_amoled_18:PSRAM=enabled,CDCOnBoot=cdc" --output-dir out firmware/cubi
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/cubi.ino.bin

  publicar:
    needs: [app, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Cubi v2.0.${{ github.run_number }}
          body: |
            - **Cubi.apk**: ábrelo desde el celular para instalar o actualizar la app.
            - **cubi.ino.bin**: en la app, Ajustes › Actualizar el robot.
          files: |
            Cubi.apk
            cubi.ino.bin
