plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cubi.robot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cubi.robot'
        minSdk 26
        targetSdk 34
        // cada compilación en GitHub sube el número, así la app nueva se instala encima de la vieja
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "2.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }  // solo celulares: el oído de "Hola Cubi" pesa por cada tipo
    }

    // Llave fija para que las actualizaciones se instalen sin desinstalar. Vive en los secretos de GitHub
    // (CUBI_LLAVE / CUBI_CLAVE) y la compilación la escribe en cubi.p12; sin ella se firma con la llave de pruebas.
    def llave = file('cubi.p12')
    signingConfigs {
        cubi {
            storeFile llave
            storeType 'pkcs12'
            storePassword System.getenv('CUBI_CLAVE')
            keyAlias 'cubi'
            keyPassword System.getenv('CUBI_CLAVE')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig llave.exists() ? signingConfigs.cubi : signingConfigs.debug
        }
    }

    // la librería de Claude trae archivos de licencia repetidos
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // "Hola Cubi": reconocimiento de voz sin internet en el celular
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    // Cubi habla con Claude Haiku
    implementation 'com.anthropic:anthropic-java:2.34.0'
}
